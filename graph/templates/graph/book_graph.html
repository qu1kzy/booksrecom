{% extends "core/base.html" %}
{% block title %}Граф: {{ book.title }} — Строка{% endblock %}

{% block content %}
<div class="wrap page" style="padding-top:32px">
  <div style="margin-bottom:16px">
    <a href="{% url 'book_detail' book.pk %}" class="lnk-muted" style="font-size:13px">&larr; {{ book.title }}</a>
  </div>
  <h1 style="font-size:22px;margin-bottom:16px">Граф связей</h1>

  <div class="graph-container" id="graph" style="position:relative;background:#fafafa;touch-action:none">
    <!-- Контролы -->
    <div style="position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:6px">
      <button id="zoom-in" style="width:32px;height:32px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)">+</button>
      <button id="zoom-out" style="width:32px;height:32px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)">&minus;</button>
      <button id="zoom-reset" style="height:32px;padding:0 10px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)">Центр</button>
    </div>
    <!-- Легенда -->
    <div id="legend" style="position:absolute;bottom:12px;left:12px;z-index:10;display:flex;flex-wrap:wrap;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);padding:8px 12px;border-radius:6px;border:1px solid #e5e5e5"></div>
    <!-- Desktop tooltip -->
    <div id="tooltip" style="display:none;position:absolute;z-index:20;background:#fff;border:1px solid #e5e5e5;
                              border-radius:8px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.1);
                              pointer-events:none;max-width:220px;font-family:Inter,system-ui,sans-serif">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <img id="tt-cover" src="" style="width:48px;height:70px;object-fit:cover;border-radius:4px;flex-shrink:0;display:none">
        <div id="tt-placeholder" style="width:48px;height:70px;background:#f3f4f6;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#9ca3af;font-weight:600"></div>
        <div style="min-width:0">
          <div id="tt-title" style="font-size:13px;font-weight:600;color:#111;line-height:1.3;margin-bottom:3px"></div>
          <div id="tt-authors" style="font-size:11px;color:#6b7280;line-height:1.3;margin-bottom:4px"></div>
          <div id="tt-rating" style="font-size:11px;color:#f59e0b;display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Мобильная модалка -->
<div id="mobile-modal" style="display:none;position:fixed;inset:0;z-index:1000;font-family:Inter,system-ui,sans-serif">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px)" onclick="closeMobileModal()"></div>
  <div id="mobile-modal-content" style="position:absolute;bottom:0;left:0;right:0;
       background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 32px;
       max-height:70vh;overflow-y:auto;
       box-shadow:0 -4px 30px rgba(0,0,0,.12);
       transform:translateY(100%);transition:transform .25s ease-out">
    <!-- Ручка (swipe handle) -->
    <div id="mm-handle" style="padding:8px 0 16px;cursor:grab;touch-action:none">
      <div style="width:36px;height:4px;border-radius:2px;background:#d0d0d0;margin:0 auto"></div>
    </div>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <img id="mm-cover" src="" style="width:72px;height:108px;object-fit:cover;border-radius:6px;flex-shrink:0;display:none">
      <div id="mm-placeholder" style="width:72px;height:108px;background:#f3f4f6;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#9ca3af;font-weight:600"></div>
      <div style="flex:1;min-width:0">
        <div id="mm-title" style="font-size:17px;font-weight:700;color:#111;line-height:1.3;margin-bottom:4px"></div>
        <div id="mm-authors" style="font-size:13px;color:#6b7280;line-height:1.3;margin-bottom:6px"></div>
        <div id="mm-rating" style="font-size:13px;color:#f59e0b;display:none"></div>
      </div>
    </div>
    <div id="mm-desc" style="display:none;margin-top:14px;font-size:13px;color:#374151;line-height:1.5;
                              border-top:1px solid #f0f0f0;padding-top:12px"></div>
    <a id="mm-link" href="#" style="display:block;margin-top:16px;text-align:center;padding:12px;
       background:#111;color:#fff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none">
      Открыть книгу
    </a>
  </div>
</div>

<script>
function closeMobileModal() {
  var content = document.getElementById('mobile-modal-content');
  content.style.transition = 'transform .25s ease-out';
  content.style.transform = 'translateY(100%)';
  setTimeout(function() { document.getElementById('mobile-modal').style.display = 'none'; }, 250);
}

// Swipe-to-dismiss
(function() {
  var handle = document.getElementById('mm-handle');
  var sheet = document.getElementById('mobile-modal-content');
  var startY = 0, currentY = 0, dragging = false;

  function onStart(e) {
    dragging = true;
    startY = (e.touches ? e.touches[0] : e).clientY;
    currentY = 0;
    sheet.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    var y = (e.touches ? e.touches[0] : e).clientY;
    currentY = Math.max(0, y - startY);
    sheet.style.transform = 'translateY(' + currentY + 'px)';
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .25s ease-out';
    if (currentY > 80) {
      closeMobileModal();
    } else {
      sheet.style.transform = 'translateY(0)';
    }
  }

  handle.addEventListener('touchstart', onStart, {passive: true});
  document.addEventListener('touchmove', function(e) { if (dragging) onMove(e); }, {passive: true});
  document.addEventListener('touchend', onEnd);
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', function(e) { if (dragging) onMove(e); });
  document.addEventListener('mouseup', onEnd);
})();
</script>
{% endblock %}

{% block extra_scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  const container = document.getElementById('graph');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const tooltip = document.getElementById('tooltip');
  const isMobile = 'ontouchstart' in window || window.innerWidth <= 768;

  const svg = d3.select('#graph').append('svg')
    .attr('width', width).attr('height', height)
    .style('font-family', 'Inter, system-ui, sans-serif');

  const g = svg.append('g');

  // Zoom — с поддержкой touch (pan + pinch)
  const zoom = d3.zoom()
    .scaleExtent([0.3, 4])
    .filter(function(e) {
      // Разрешаем touch-события для pan/pinch
      if (e.type === 'touchstart' || e.type === 'touchmove' || e.type === 'touchend') return true;
      // На десктопе — колёсико и drag средней кнопкой
      return !e.button;
    })
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  document.getElementById('zoom-in').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  document.getElementById('zoom-out').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  document.getElementById('zoom-reset').onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

  // Desktop tooltip
  function showTooltip(e, d) {
    if (isMobile) return;
    const rect = container.getBoundingClientRect();
    document.getElementById('tt-title').textContent = d.title;
    document.getElementById('tt-authors').textContent = d.authors || '';
    var cover = document.getElementById('tt-cover');
    var ph = document.getElementById('tt-placeholder');
    if (d.cover) { cover.src = d.cover; cover.style.display = 'block'; ph.style.display = 'none'; }
    else { cover.style.display = 'none'; ph.style.display = 'flex'; ph.textContent = d.title.charAt(0).toUpperCase(); }
    var rEl = document.getElementById('tt-rating');
    if (d.rating) { rEl.textContent = '\u2605 ' + d.rating.toFixed(1); rEl.style.display = 'block'; }
    else { rEl.style.display = 'none'; }
    tooltip.style.left = Math.min(e.clientX - rect.left + 16, width - 240) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    tooltip.style.display = 'block';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  // Mobile modal
  function showMobileModal(d) {
    document.getElementById('mm-title').textContent = d.title;
    document.getElementById('mm-authors').textContent = d.authors || '';
    document.getElementById('mm-link').href = '/books/' + d.id + '/';

    var cover = document.getElementById('mm-cover');
    var ph = document.getElementById('mm-placeholder');
    if (d.cover) { cover.src = d.cover; cover.style.display = 'block'; ph.style.display = 'none'; }
    else { cover.style.display = 'none'; ph.style.display = 'flex'; ph.textContent = d.title.charAt(0).toUpperCase(); }

    var rEl = document.getElementById('mm-rating');
    if (d.rating) { rEl.textContent = '\u2605 ' + d.rating.toFixed(1); rEl.style.display = 'block'; }
    else { rEl.style.display = 'none'; }

    var descEl = document.getElementById('mm-desc');
    if (d.description) { descEl.textContent = d.description; descEl.style.display = 'block'; }
    else { descEl.style.display = 'none'; }

    document.getElementById('mobile-modal').style.display = 'block';
    // Trigger slide-up animation
    requestAnimationFrame(function() {
      document.getElementById('mobile-modal-content').style.transform = 'translateY(0)';
    });
  }

  fetch('{% url "book_graph_data" book.pk %}')
    .then(r => r.json())
    .then(data => {
      if (!data.nodes.length) {
        svg.append('text').attr('x', width/2).attr('y', height/2)
          .attr('text-anchor', 'middle').attr('fill', '#9ca3af').attr('font-size', '14px')
          .text('Связей пока нет');
        return;
      }

      // Legend
      var types = [...new Set(data.links.map(l => l.type))];
      var legendEl = document.getElementById('legend');
      types.forEach(t => {
        var lnk = data.links.find(l => l.type === t);
        legendEl.innerHTML += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#6b7280">' +
          '<div style="width:10px;height:10px;border-radius:50%;background:' + lnk.color + '"></div>' + lnk.label + '</div>';
      });

      // Gradient defs for links
      var defs = svg.append('defs');
      data.links.forEach((l, i) => {
        var grad = defs.append('linearGradient').attr('id', 'lg-' + i).attr('gradientUnits', 'userSpaceOnUse');
        grad.append('stop').attr('offset', '0%').attr('stop-color', l.color).attr('stop-opacity', 0.4);
        grad.append('stop').attr('offset', '100%').attr('stop-color', l.color).attr('stop-opacity', 0.15);
      });

      // Card dimensions
      var cardW = d => d.is_center ? 130 : 100;
      var cardH = d => d.is_center ? 170 : 140;
      var coverH = d => d.is_center ? 110 : 85;

      var sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(200))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => d.is_center ? 100 : 80));

      // Links — curved
      g.selectAll('.link')
        .data(data.links).join('path')
        .attr('fill', 'none')
        .attr('stroke', (d, i) => 'url(#lg-' + i + ')')
        .attr('stroke-width', d => Math.max(1.5, d.weight * 1.2))
        .attr('opacity', 0)
        .transition().duration(800).delay((d, i) => 200 + i * 30)
        .attr('opacity', 1);

      var linkSel = g.selectAll('path');

      // Nodes — card groups
      var node = g.selectAll('.node')
        .data(data.nodes).join('g')
        .attr('cursor', 'pointer')
        .style('opacity', 0);

      // Drag — работает и на touch
      node.call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

      // Desktop: click → перейти к книге, hover → tooltip
      if (!isMobile) {
        node.on('click', (e, d) => { window.location.href = '/books/' + d.id + '/'; })
            .on('mouseenter', showTooltip)
            .on('mousemove', showTooltip)
            .on('mouseleave', hideTooltip);
      }

      // Mobile: tap на карточку → модалка (но не на подпись)
      if (isMobile) {
        node.on('click', (e, d) => {
          e.stopPropagation();
          showMobileModal(d);
        });
      }

      // Animate in
      node.transition().duration(600).delay((d, i) => i * 80).style('opacity', 1);

      // Card background
      node.append('rect')
        .attr('x', d => -cardW(d) / 2)
        .attr('y', d => -cardH(d) / 2)
        .attr('width', d => cardW(d))
        .attr('height', d => cardH(d))
        .attr('rx', 8)
        .attr('fill', '#fff')
        .attr('stroke', d => d.is_center ? '#111' : '#e5e5e5')
        .attr('stroke-width', d => d.is_center ? 2 : 1)
        .style('filter', 'drop-shadow(0 2px 8px rgba(0,0,0,.07))');

      // Cover image clips
      data.nodes.forEach(d => {
        if (d.cover) {
          defs.append('clipPath').attr('id', 'cc-' + d.id)
            .append('rect')
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d)).attr('rx', 4);
        }
      });

      node.each(function(d) {
        var el = d3.select(this);
        if (d.cover) {
          el.append('image').attr('href', d.cover)
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d))
            .attr('clip-path', 'url(#cc-' + d.id + ')')
            .attr('preserveAspectRatio', 'xMidYMid slice');
        } else {
          el.append('rect')
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d))
            .attr('rx', 4).attr('fill', '#f3f4f6');
        }
      });

      // Title — на мобильном это ссылка на книгу
      node.each(function(d) {
        var el = d3.select(this);
        var label = d.title.length > 16 ? d.title.slice(0, 14) + '...' : d.title;
        var yPos = cardH(d) / 2 - (d.is_center ? 24 : 20);

        var titleText = el.append('text')
          .text(label)
          .attr('y', yPos)
          .attr('text-anchor', 'middle')
          .attr('font-size', d.is_center ? '12px' : '10px')
          .attr('font-weight', '600')
          .attr('fill', isMobile ? '#2563eb' : '#111')
          .attr('text-decoration', isMobile ? 'underline' : 'none')
          .attr('cursor', 'pointer');

        if (isMobile) {
          titleText.on('click', function(e) {
            e.stopPropagation();
            window.location.href = '/books/' + d.id + '/';
          });
        }
      });

      // Authors
      node.append('text')
        .text(d => { var a = d.authors || ''; return a.length > 18 ? a.slice(0, 16) + '...' : a; })
        .attr('y', d => cardH(d) / 2 - (d.is_center ? 10 : 8))
        .attr('text-anchor', 'middle')
        .attr('font-size', '9px')
        .attr('fill', '#9ca3af');

      // Tick
      sim.on('tick', () => {
        linkSel.attr('d', d => {
          var dx = d.target.x - d.source.x;
          var dy = d.target.y - d.source.y;
          var dr = Math.sqrt(dx * dx + dy * dy) * 0.8;
          return 'M' + d.source.x + ',' + d.source.y + 'A' + dr + ',' + dr + ' 0 0,1 ' + d.target.x + ',' + d.target.y;
        });
        node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
      });
    });
})();
</script>
{% endblock %}
