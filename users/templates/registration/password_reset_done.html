{% extends "core/base.html" %}
{% block title %}Письмо отправлено — Строка{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box" style="max-width:400px;text-align:center">

    <div style="width:64px;height:64px;border-radius:50%;background:#f0fdf4;border:2px solid #bbf7d0;
                display:flex;align-items:center;justify-content:center;
                margin:0 auto 20px;font-size:26px">✉</div>

    <h1 class="auth-box__h" style="font-size:22px;margin-bottom:10px">Проверьте почту</h1>
    <p style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:24px;max-width:300px;margin-left:auto;margin-right:auto">
      Мы отправили ссылку для сброса пароля. Проверьте входящие (и папку «Спам»).
    </p>

    <div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
                background:var(--surface);font-size:13px;color:var(--muted);margin-bottom:24px">
      Ссылка действительна <strong style="color:var(--ink)">24 часа</strong>
    </div>

    <a href="{% url 'login' %}" class="lnk-muted" style="font-size:13px">← Вернуться ко входу</a>
  </div>
</div>
{% endblock %}
