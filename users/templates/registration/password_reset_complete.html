{% extends "core/base.html" %}
{% block title %}Пароль изменён — Строка{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box" style="max-width:400px;text-align:center">

    <div style="width:64px;height:64px;border-radius:50%;background:#f0fdf4;border:2px solid #bbf7d0;
                display:flex;align-items:center;justify-content:center;
                margin:0 auto 20px;font-size:26px">✓</div>

    <h1 class="auth-box__h" style="font-size:22px;margin-bottom:10px">Готово!</h1>
    <p style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:28px">
      Пароль успешно изменён. Теперь можно войти.
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary" style="justify-content:center;width:100%;padding:10px">
      Войти
    </a>
  </div>
</div>
{% endblock %}
