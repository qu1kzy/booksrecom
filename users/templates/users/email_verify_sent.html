{% extends "core/base.html" %}
{% block title %}Проверьте почту — Строка{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box" style="text-align:center">
    <h1 class="auth-box__h">Проверьте почту</h1>
    <p style="font-size:14px;color:var(--muted);margin-top:12px;margin-bottom:28px">
      Мы отправили ссылку для подтверждения на
      <b>{{ email }}</b>.<br>
      Перейдите по ней, чтобы активировать аккаунт.
    </p>
    <a href="{% url 'login' %}" class="btn btn-secondary">Вернуться ко входу</a>
  </div>
</div>
{% endblock %}
