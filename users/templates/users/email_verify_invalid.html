{% extends "core/base.html" %}
{% block title %}Ссылка недействительна — Строка{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box" style="text-align:center">
    <h1 class="auth-box__h">Ссылка недействительна</h1>
    <p style="font-size:14px;color:var(--muted);margin-top:12px;margin-bottom:28px">
      Ссылка для подтверждения email устарела или уже была использована.
    </p>
    <a href="{% url 'register' %}" class="btn btn-secondary">Зарегистрироваться заново</a>
  </div>
</div>
{% endblock %}
