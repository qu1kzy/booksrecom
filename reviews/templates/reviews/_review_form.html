{% load widget_tweaks %}
<p style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">Оставить отзыв</p>
<form hx-post="{% url 'review_create' book.id %}"
      hx-target="#review-form-wrap"
      hx-swap="outerHTML"
      hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>

  <div x-data="{ rating: 0 }" style="margin-bottom:12px">
    <span style="font-size:12px;color:var(--muted);margin-right:8px">Оценка:</span>
    <input type="hidden" name="rating" :value="rating">
    <div class="star-pick">
      {% for i in "12345" %}
      <button type="button" class="star-pick__star"
              :class="{'star-pick__star--on': {{ forloop.counter }} <= rating}"
              @click="rating = {{ forloop.counter }}">★</button>
      {% endfor %}
    </div>
  </div>

  <div class="form-group">
    <textarea class="form-input form-textarea" name="text"
              placeholder="Ваш отзыв..." rows="3"></textarea>
  </div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <button type="submit" class="btn btn-primary btn-sm">Опубликовать</button>
</form>
