{# Форма с reCAPTCHA перед запросом цены #}
<div id="price-block-{{ book.id }}">
  <form hx-post="{% url 'request_price' book.id %}"
        hx-target="#price-block-{{ book.id }}"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'
        style="display:flex;flex-direction:column;gap:10px;padding:12px 14px;
               border:1px solid var(--border);border-radius:var(--radius);
               background:var(--surface);max-width:320px">

    <p style="font-size:13px;font-weight:500;margin:0">Подтвердите запрос цены</p>

    {% if error %}
      <p style="font-size:12px;color:var(--err)">{{ error }}</p>
    {% endif %}

    <div class="g-recaptcha"
         data-sitekey="{{ recaptcha_site_key }}"
         data-theme="light"
         data-size="normal">
    </div>

    <div style="display:flex;gap:8px;align-items:center">
      <button type="submit" class="btn btn-primary btn-sm">Получить цену</button>
      <button type="button" class="btn btn-ghost btn-sm"
              onclick="this.closest('[id^=price-block]').innerHTML=
                '<span style=\'font-size:12px;color:var(--ghost)\'>Отменено</span>'">
        Отмена
      </button>
    </div>
  </form>
</div>
