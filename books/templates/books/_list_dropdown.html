{% if user_lists %}
<div x-data="{ open: false }" style="position:relative">
  <button class="btn btn-secondary btn-sm" @click="open=!open" type="button">
    В список
    <span style="font-size:10px">▾</span>
  </button>
  <div x-show="open" x-cloak @click.outside="open=false"
       style="position:absolute;top:100%;left:0;margin-top:4px;z-index:50;
              background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
              min-width:180px;box-shadow:0 4px 12px rgba(0,0,0,.08)">
    {% for ul in user_lists %}
    <label style="display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
                  font-size:13px;border-bottom:1px solid var(--border)"
           hx-post="{% url 'toggle_list' %}"
           hx-vals='{"book_id":"{{ book.id }}","list_id":"{{ ul.id }}"}'
           hx-target="#book-list-dropdown-{{ book.id }}"
           hx-swap="innerHTML"
           hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>
      <input type="checkbox" {% if ul.id in book_list_ids %}checked{% endif %}
             style="accent-color:var(--ink);pointer-events:none">
      {{ ul.name }}
      {% if ul.is_default %}<span style="font-size:10px;color:var(--ghost)">(по умолчанию)</span>{% endif %}
    </label>
    {% endfor %}
    <a href="{% url 'profile' %}" style="display:block;padding:8px 12px;font-size:12px;color:var(--muted)">
      + Управлять списками
    </a>
  </div>
</div>
{% endif %}
