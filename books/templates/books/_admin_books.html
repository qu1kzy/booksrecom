<div style="display:flex;flex-direction:column;gap:6px">
  {% for book in books %}
  <div id="ab-{{ book.id }}" class="admin-book-row">

    <div style="min-width:0">
      <div style="font-size:13px;font-weight:600;
                  white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        <a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a>
      </div>
    </div>

    <div style="font-size:12px;color:var(--muted);
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      {% for a in book.authors.all %}{{ a.name }}{% if not forloop.last %}, {% endif %}{% endfor %}
    </div>

    <div style="font-size:12px;color:var(--ghost);text-align:center">
      {{ book.publication_year|default:"—" }}
    </div>

    <div style="font-size:12px;color:var(--muted);text-align:center">
      ★ {{ book.avg_rating }}
    </div>

    <div style="display:flex;gap:6px;justify-content:flex-end">
      <a href="{% url 'admin:books_book_change' book.id %}" class="btn btn-ghost btn-sm">Ред.</a>
      <button class="btn btn-danger btn-sm"
              hx-post="{% url 'admin_delete_book' book.id %}"
              hx-target="#ab-{{ book.id }}"
              hx-swap="outerHTML"
              hx-confirm="Удалить «{{ book.title }}»?"
              hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>
        Удалить
      </button>
    </div>
  </div>
  {% empty %}
  <p class="empty">Книги не найдены</p>
  {% endfor %}
</div>
